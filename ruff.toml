# Ruff's default rule set grows between releases, and a rule added upstream
# turns a contributor's CI red on code they did not write. This file does not
# restate the whole set; it takes the defaults and subtracts. The protection
# against drift is the version pin in `requirements-dev.txt`, not this file.

# Ruff's *formatter* reformats Python code blocks inside Markdown; its linter
# never reads Markdown at all. Documentation snippets are written to be read,
# not to satisfy a formatter: a signature deliberately shown on one line comes
# back exploded across seven, and CI goes red over prose.
#
# The cost of this exclusion is real and worth knowing: the Python in docs/ is
# not even syntax-checked. It has been checked by hand; check yours by hand too.
extend-exclude = ["*.md"]

[lint]
ignore = [
    # A per-item `except Exception` is the plugin contract for both systems:
    # a failure must cost one image, not the whole batch. Third-party model
    # code raises whatever it likes, so the catch cannot be narrowed honestly.
    "BLE001",
    # The `models` header field is a list literal on the class, which RUF012
    # wants annotated `ClassVar`. It is declarative metadata, never mutated,
    # and meant to be read straight off the source, so an import and an
    # annotation in every plugin buy nothing. Ruff's other suggestion, a tuple,
    # is why the header is specified as a list rather than left open: a
    # one-entry tuple needs a trailing comma, in a field every contributor
    # copies and edits, and one shape is one thing to document. The rule would
    # otherwise fire on the required header of every plugin in the repository,
    # which is a rule nobody would keep. The cost: a plugin holding mutable
    # class-level state (`_cache = {}`) is no longer flagged, so watch for that
    # when reviewing one.
    "RUF012",
]
