name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: pip install -r requirements-dev.txt

      # --no-deps on purpose: the tests only import the two plugin base
      # classes, and a full install would pull torch and friends for nothing.
      # requirements-dev.txt carries what those base classes actually need.
      - name: Install the PixlStash base classes
        run: pip install --no-deps pixlstash

      # Note on what this job is and is not. It does NOT install a plugin's own
      # requirements.txt, so a plugin with third-party dependencies is skipped
      # entirely by the contract tests: skipped means unchecked, not
      # half-checked. And it is not a security boundary either way, since pytest
      # imports and runs a pull request's plugin code. Read a plugin before
      # merging it.
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
